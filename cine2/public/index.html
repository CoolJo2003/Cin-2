<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cine2 — Votre salle de projection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #14101c;
    --panel: #1f1830;
    --panel-2: #291f3d;
    --gold: #ffd66b;
    --velvet: #7c6a93;
    --velvet-dark: #5b4d72;
    --live: #ff6b6b;
    --text: #f4f0fa;
    --muted: #a99cc0;
    --line: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--deep);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
  }
  h1, h2, .display {
    font-family: 'Fraunces', serif;
    letter-spacing: -0.5px;
  }

  /* ---------- LOBBY ---------- */
  #lobby {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,214,107,0.10), transparent 70%),
      var(--deep);
  }
  #lobby h1 {
    font-size: clamp(2.2rem, 6vw, 3rem);
    font-weight: 600;
    margin: 0 0 6px;
  }
  #lobby p.tagline {
    color: var(--muted);
    margin: 0 0 32px;
    text-align: center;
    max-width: 360px;
  }
  .lobby-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  .lobby-actions { display: flex; gap: 10px; }
  .join-row { display: flex; gap: 10px; margin-top: 14px; }
  input[type=text] {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--deep);
    color: var(--text);
    font-size: 1rem;
    text-transform: uppercase;
  }
  input[type=text]::placeholder { color: var(--muted); text-transform: none; }
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    color: var(--text);
  }
  .btn {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    flex: 1;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .btn-gold { background: var(--gold); color: #241b0a; }
  .btn-ghost { background: var(--panel-2); color: var(--text); }
  #status {
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.88rem;
    min-height: 20px;
    text-align: center;
  }
  #roomInfo { display: none; text-align: center; margin-top: 18px; }
  #roomCodeBig {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    letter-spacing: 6px;
    color: var(--gold);
  }
  #shareLink {
    background: var(--deep);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.8rem;
    color: var(--muted);
    word-break: break-all;
    margin-top: 8px;
  }
  .copy-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-small {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .hidden { display: none !important; }

  /* ---------- CINEMA ROOM ---------- */
  #room {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 70% 35% at 50% 8%, rgba(255,214,107,0.14), transparent 65%),
      linear-gradient(180deg, #0f0b17 0%, var(--deep) 55%, #0c0910 100%);
    position: relative;
    overflow: hidden;
  }

  /* illustrated cinema-hall backdrop: rows of seat silhouettes + curtain folds,
     sits behind the real screen/seats which stay fully opaque on top */
  .room-backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }

  .stage {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: minmax(90px, 1fr) minmax(0, 3fr) minmax(90px, 1fr);
    align-items: center;
    gap: 12px;
    padding: 18px 20px 8px;
    min-height: 0;
  }

  .screen-wrap {
    position: relative;
    grid-column: 2;
    aspect-ratio: 16 / 9;
    max-height: 62vh;
    margin: 0 auto;
    width: 100%;
    background: #08060c;
    border-radius: 14px;
    border: 3px solid #100b18;
    box-shadow:
      0 0 0 1px rgba(255,214,107,0.15),
      0 20px 60px rgba(0,0,0,0.55),
      0 0 90px rgba(255,214,107,0.10);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #screenVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
    display: none;
  }
  .screen-placeholder {
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    padding: 20px;
  }
  .screen-placeholder .icon { font-size: 2rem; display: block; margin-bottom: 8px; opacity: 0.6; }

  .fullscreen-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: rgba(0,0,0,0.45);
    color: var(--text);
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .screen-wrap:hover .fullscreen-btn { opacity: 1; }

  /* seats */
  .seat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    justify-self: center;
  }
  .seat-illustration {
    width: clamp(56px, 7vw, 92px);
    height: clamp(40px, 5vw, 60px);
    background: rgba(124, 106, 147, 0.35);
    backdrop-filter: blur(2px);
    border-radius: 12px 12px 5px 5px;
    position: relative;
    box-shadow: inset 0 -8px 12px rgba(0,0,0,0.2);
  }
  .seat-illustration::before {
    content: "";
    position: absolute;
    left: -8px; right: -8px; bottom: -6px;
    height: 10px;
    background: rgba(91, 77, 114, 0.4);
    border-radius: 8px;
  }

  /* camera tile: a proper rectangular video tile (like a call participant),
     large enough that a face isn't cropped by a small circular mask */
  .avatar-bubble {
    width: clamp(96px, 14vw, 168px);
    height: clamp(72px, 10.5vw, 126px);
    border-radius: 14px;
    background: rgba(41, 31, 61, 0.55);
    backdrop-filter: blur(3px);
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    order: -1;
    margin-bottom: -4px;
    z-index: 2;
  }
  .avatar-bubble.mic-live { box-shadow: 0 0 0 3px var(--live); }
  .avatar-bubble video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  .avatar-bubble .avatar-fallback { font-size: clamp(1.4rem, 3.6vw, 2.1rem); }

  .seat-label {
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
  }
  .seat-status {
    font-size: 0.68rem;
    color: var(--velvet);
  }

  /* control bar */
  .control-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    flex-wrap: wrap;
    background: rgba(15, 11, 23, 0.75);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .ctrl-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--panel-2);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.12s ease, transform 0.12s ease;
  }
  .ctrl-btn:hover { transform: translateY(-2px); }
  .ctrl-btn.off { background: #3a2f4d; color: var(--muted); }
  .ctrl-btn.on { background: var(--gold); color: #241b0a; }
  .ctrl-btn.danger { background: var(--live); color: white; }
  .share-pill {
    height: 46px;
    padding: 0 18px;
    border-radius: 23px;
    background: var(--panel-2);
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .share-pill.active { background: var(--gold); color: #241b0a; }
  .room-code-pill {
    height: 46px;
    padding: 0 16px;
    border-radius: 23px;
    background: var(--panel-2);
    display: flex;
    align-items: center;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 2px;
  }
  .room-code-pill b { color: var(--text); margin-left: 6px; }

  /* ---------- FULLSCREEN MODE ---------- */
  #room.fullscreen-mode .stage {
    grid-template-columns: 1fr;
    padding: 0;
  }
  #room.fullscreen-mode .screen-wrap {
    grid-column: 1;
    max-height: 100%;
    height: 100%;
    aspect-ratio: unset;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  #room.fullscreen-mode .seat {
    position: fixed;
    bottom: 96px;
    z-index: 5;
    flex-direction: row;
    background: rgba(15,11,23,0.6);
    backdrop-filter: blur(8px);
    padding: 6px 12px 6px 6px;
    border-radius: 30px;
    gap: 8px;
  }
  #room.fullscreen-mode .seat-illustration { display: none; }
  #room.fullscreen-mode .avatar-bubble {
    width: 76px; height: 56px;
    border-radius: 10px;
    margin-bottom: 0;
  }
  #room.fullscreen-mode .seat-status { display: none; }
  #room.fullscreen-mode .seat-left { left: 16px; }
  #room.fullscreen-mode .seat-right { right: 16px; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 640px) {
    .stage {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      padding: 14px 12px 4px;
    }
    .screen-wrap { grid-column: 1; max-height: 42vh; }
    .seats-row {
      grid-column: 1;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      margin-top: 6px;
    }
    .ctrl-btn { width: 42px; height: 42px; }
    .room-code-pill { display: none; }
    #room.fullscreen-mode .seat { bottom: 84px; padding: 5px 10px 5px 5px; }
    #room.fullscreen-mode .avatar-bubble { width: 60px; height: 44px; border-radius: 8px; }
  }

  /* persistent "sharing" badge, visible even when you switch tabs back to your own site */
  .share-badge {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--live);
    color: white;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 10;
  }
  .share-badge.visible { display: flex; }
  .share-badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: white;
    animation: pulse-dot 1.4s infinite ease-in-out;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* simple universal mic / camera icons */
  .ctrl-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<!-- ============ LOBBY ============ -->
<div id="lobby">
  <h1>Ciné2</h1>
  <p class="tagline">Ta salle de projection privée. Créez un salon, invitez une personne, regardez ensemble.</p>

  <div class="lobby-card">
    <div class="lobby-actions">
      <button class="btn btn-gold" id="createBtn">Créer un salon</button>
      <button class="btn btn-ghost" id="joinToggleBtn">Rejoindre</button>
    </div>
    <div class="join-row hidden" id="joinRow">
      <input type="text" id="codeInput" placeholder="Code du salon" maxlength="6">
      <button class="btn btn-gold" id="joinBtn" style="flex: 0 0 auto;">OK</button>
    </div>
    <div id="roomInfo">
      <div id="roomCodeBig"></div>
      <div id="shareLink"></div>
      <div class="copy-row">
        <button class="btn btn-ghost btn-small" id="copyLinkBtn" style="flex:1;">Copier le lien</button>
        <button class="btn btn-gold btn-small" id="enterRoomBtn" style="flex:1;">Entrer dans le salon</button>
      </div>
    </div>
    <div id="status"></div>
  </div>
</div>

<!-- ============ CINEMA ROOM ============ -->
<div id="room" class="hidden">
  <svg class="room-backdrop" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3a2a52"/>
        <stop offset="50%" stop-color="#5b4074"/>
        <stop offset="100%" stop-color="#3a2a52"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="60" height="450" fill="url(#curtain)"/>
    <rect x="740" y="0" width="60" height="450" fill="url(#curtain)"/>
    <g opacity="0.5">
      <ellipse cx="150" cy="420" rx="26" ry="12" fill="#5b4d72"/>
      <ellipse cx="220" cy="425" rx="26" ry="12" fill="#5b4d72"/>
      <ellipse cx="580" cy="425" rx="26" ry="12" fill="#5b4d72"/>
      <ellipse cx="650" cy="420" rx="26" ry="12" fill="#5b4d72"/>
      <ellipse cx="185" cy="440" rx="26" ry="12" fill="#4a3f61"/>
      <ellipse cx="615" cy="440" rx="26" ry="12" fill="#4a3f61"/>
    </g>
  </svg>

  <div class="share-badge" id="shareBadge"><span class="dot"></span> Partage d'écran actif</div>

  <div class="stage">
    <div class="seat seat-left" id="seatHost">
      <div class="avatar-bubble" id="avatarHost">
        <video id="camHostVideo" autoplay playsinline muted></video>
        <span class="avatar-fallback">🎬</span>
      </div>
      <div class="seat-illustration"></div>
      <span class="seat-label" id="labelHost">Toi</span>
      <span class="seat-status" id="statusHost"></span>
    </div>

    <div class="screen-wrap" id="screenWrap">
      <video id="screenVideo" autoplay playsinline></video>
      <div class="screen-placeholder" id="screenPlaceholder">
        <span class="icon">🎞️</span>
        Écran libre — personne ne partage pour l'instant
      </div>
      <button class="fullscreen-btn" id="fullscreenBtn" title="Plein écran">⤢</button>
    </div>

    <div class="seat seat-right" id="seatGuest">
      <div class="avatar-bubble" id="avatarGuest">
        <video id="camGuestVideo" autoplay playsinline></video>
        <span class="avatar-fallback">👤</span>
      </div>
      <div class="seat-illustration"></div>
      <span class="seat-label" id="labelGuest">En attente…</span>
      <span class="seat-status" id="statusGuest"></span>
    </div>
  </div>

  <div class="control-bar">
    <button class="ctrl-btn off" id="micBtn" title="Micro">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22h2v-2.06A9 9 0 0 0 21 11h-2z"/></svg>
    </button>
    <button class="ctrl-btn off" id="camBtn" title="Caméra">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>
    <button class="share-pill" id="shareBtn">Partager l'écran</button>
    <div class="room-code-pill">SALON <b id="roomCodeTag"></b></div>
    <button class="ctrl-btn danger" id="leaveBtn" title="Quitter">✕</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const lobby = $('lobby'), room = $('room');
const statusEl = $('status');
const roomInfo = $('roomInfo'), roomCodeBig = $('roomCodeBig'), shareLinkEl = $('shareLink');
const roomCodeTag = $('roomCodeTag');

const screenVideo = $('screenVideo'), screenPlaceholder = $('screenPlaceholder'), screenWrap = $('screenWrap');
const camHostVideo = $('camHostVideo'), camGuestVideo = $('camGuestVideo');
const avatarHost = $('avatarHost'), avatarGuest = $('avatarGuest');
const labelGuest = $('labelGuest'), statusHost = $('statusHost'), statusGuest = $('statusGuest');

const micBtn = $('micBtn'), camBtn = $('camBtn'), shareBtn = $('shareBtn'), leaveBtn = $('leaveBtn'), fullscreenBtn = $('fullscreenBtn');
const shareBadge = $('shareBadge');
const copyLinkBtn = $('copyLinkBtn'), enterRoomBtn = $('enterRoomBtn');
const createBtn = $('createBtn'), joinBtn = $('joinBtn');
let pendingLink = '';

const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProtocol}://${location.host}`);

let pc = null;
let isHost = false;
let roomCode = null;
let hasJoinedOrCreated = false; // guards against double create/join clicks

// transceiver order agreed in advance: 0 = screen video, 1 = cam video, 2 = mic audio
const T_SCREEN = 0, T_CAM = 1, T_MIC = 2;

let localScreenTrack = null;
let localCamStream = null;
let localMicStream = null;
let micOn = false, camOn = false, sharing = false;

const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function setStatus(msg) { statusEl.textContent = msg; }

function enterRoomView() {
  lobby.classList.add('hidden');
  room.classList.remove('hidden');
  roomCodeTag.textContent = roomCode;
  $('labelHost').textContent = isHost ? 'Toi (hôte)' : 'Hôte';
}

// shows the video and hides the fallback icon together, so the icon never
// squeezes the video tile's width via the flex layout
function showTileVideo(videoEl, on) {
  videoEl.style.display = on ? 'block' : 'none';
  const fallback = videoEl.parentElement.querySelector('.avatar-fallback');
  if (fallback) fallback.style.display = on ? 'none' : 'block';
}

function safePlay(videoEl) { videoEl.play?.().catch(() => {}); }

// ---------------- WebRTC plumbing ----------------

function bindOntrack() {
  pc.ontrack = (event) => {
    const idx = pc.getTransceivers().indexOf(event.transceiver);
    const track = event.track;

    if (idx === T_SCREEN) {
      screenVideo.srcObject = event.streams[0] || new MediaStream([track]);
      const sync = () => {
        const live = !track.muted && track.readyState === 'live';
        screenVideo.style.display = live ? 'block' : 'none';
        screenPlaceholder.style.display = live ? 'none' : 'flex';
        if (live) safePlay(screenVideo);
      };
      track.onunmute = sync; track.onmute = sync; track.onended = sync;
      sync();
    }

    if (idx === T_CAM) {
      const otherVideo = isHost ? camGuestVideo : camHostVideo;
      otherVideo.srcObject = event.streams[0] || new MediaStream([track]);
      const sync = () => {
        const live = !track.muted && track.readyState === 'live';
        showTileVideo(otherVideo, live);
        if (live) safePlay(otherVideo);
      };
      track.onunmute = sync; track.onmute = sync; track.onended = sync;
      sync();
    }

    if (idx === T_MIC) {
      const audioEl = new Audio();
      audioEl.srcObject = event.streams[0] || new MediaStream([track]);
      audioEl.autoplay = true;
      const otherStatus = isHost ? statusGuest : statusHost;
      const sync = () => {
        const live = !track.muted && track.readyState === 'live';
        otherStatus.textContent = live ? '🎤 micro ouvert' : '';
        if (live) safePlay(audioEl);
      };
      track.onunmute = sync; track.onmute = sync; track.onended = sync;
      sync();
    }
  };
}

function attachPendingLocalTracks() {
  // apply any mic/cam/share already toggled on before the peer connected
  if (micOn && localMicStream) pc.getTransceivers()[T_MIC].sender.replaceTrack(localMicStream.getAudioTracks()[0]);
  if (camOn && localCamStream) pc.getTransceivers()[T_CAM].sender.replaceTrack(localCamStream.getVideoTracks()[0]);
  if (sharing && localScreenTrack) pc.getTransceivers()[T_SCREEN].sender.replaceTrack(localScreenTrack);
}

function closeExistingConnection() {
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
}

// OFFERER path (host, once a guest joins): this side must declare the
// 3 transceivers itself, in the fixed order, before creating the offer.
async function startAsOfferer() {
  closeExistingConnection(); // never stack a second connection on repeated peer-joined events
  pc = new RTCPeerConnection(rtcConfig);
  pc.addTransceiver('video', { direction: 'sendrecv' }); // screen
  pc.addTransceiver('video', { direction: 'sendrecv' }); // cam
  pc.addTransceiver('audio', { direction: 'sendrecv' }); // mic
  pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate })); };
  bindOntrack();
  attachPendingLocalTracks();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({ type: 'offer', sdp: offer }));
}

// ANSWERER path (guest, receiving the offer): must NOT pre-create its own
// transceivers — setRemoteDescription auto-creates them to match the
// offer's m-line order (screen, cam, mic), guaranteeing both sides agree
// on index 0/1/2. Creating our own transceivers here was the bug that made
// camera/mic/screen show up scrambled or not at all on the other side.
async function startAsAnswerer(offerSdp) {
  closeExistingConnection();
  pc = new RTCPeerConnection(rtcConfig);
  pc.onicecandidate = (e) => { if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate })); };
  bindOntrack();
  await pc.setRemoteDescription(new RTCSessionDescription(offerSdp));
  attachPendingLocalTracks();
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', sdp: answer }));
}

// ---------------- Signaling ----------------

ws.onmessage = async (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === 'created') {
    roomCode = msg.code;
    roomCodeBig.textContent = roomCode;
    pendingLink = `${location.origin}?join=${roomCode}`;
    shareLinkEl.textContent = pendingLink;
    roomInfo.style.display = 'block';
    setStatus('Salon prêt. Copie le lien ou le code, envoie-le, puis entre quand tu veux.');
  }

  if (msg.type === 'joined') {
    roomCode = msg.code;
    setStatus('Salon rejoint.');
    enterRoomView();
    labelGuest.textContent = 'Toi (invité)';
  }

  if (msg.type === 'error') {
    setStatus('Erreur : ' + msg.message);
    hasJoinedOrCreated = false;
    createBtn.disabled = false;
    joinBtn.disabled = false;
  }

  if (msg.type === 'peer-joined') {
    if (isHost) { labelGuest.textContent = 'Invité connecté'; await startAsOfferer(); }
  }

  if (msg.type === 'peer-left') {
    labelGuest.textContent = isHost ? 'En attente…' : 'Hôte';
    [statusHost, statusGuest].forEach(s => s.textContent = '');
    screenVideo.style.display = 'none';
    screenPlaceholder.style.display = 'flex';
    showTileVideo(camGuestVideo, false);
    showTileVideo(camHostVideo, false);
    closeExistingConnection();
  }

  if (msg.type === 'offer') {
    await startAsAnswerer(msg.sdp);
    labelGuest.textContent = isHost ? 'Invité connecté' : labelGuest.textContent;
  }

  if (msg.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  }

  if (msg.type === 'ice' && pc) {
    try { await pc.addIceCandidate(msg.candidate); } catch (e) {}
  }
};

// ---------------- Lobby UI ----------------

createBtn.onclick = () => {
  if (hasJoinedOrCreated) return; // block double clicks that create ghost sessions
  hasJoinedOrCreated = true;
  createBtn.disabled = true;
  isHost = true;
  ws.send(JSON.stringify({ type: 'create' }));
};

$('joinToggleBtn').onclick = () => $('joinRow').classList.toggle('hidden');

joinBtn.onclick = () => {
  if (hasJoinedOrCreated) return; // block double clicks that create ghost sessions
  const code = $('codeInput').value.trim().toUpperCase();
  if (!code) return;
  hasJoinedOrCreated = true;
  joinBtn.disabled = true;
  isHost = false;
  ws.send(JSON.stringify({ type: 'join', code }));
};

copyLinkBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(pendingLink);
    copyLinkBtn.textContent = 'Copié !';
    setTimeout(() => copyLinkBtn.textContent = 'Copier le lien', 1500);
  } catch (e) {
    setStatus("Impossible de copier automatiquement, sélectionne le lien à la main.");
  }
};
enterRoomBtn.onclick = () => enterRoomView();

// Note: the invited person must open the "Rejoindre" panel and type the
// code themselves — the link no longer auto-fills or auto-opens it, so a
// stray click can't accidentally send a duplicate join.

// ---------------- Room controls ----------------

micBtn.onclick = async () => {
  if (!localMicStream) {
    try { localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { setStatus('Micro refusé ou indisponible.'); return; }
  }
  micOn = !micOn;
  localMicStream.getAudioTracks()[0].enabled = micOn;
  micBtn.classList.toggle('on', micOn);
  micBtn.classList.toggle('off', !micOn);
  if (pc) pc.getTransceivers()[T_MIC].sender.replaceTrack(micOn ? localMicStream.getAudioTracks()[0] : null);
};

camBtn.onclick = async () => {
  const selfVideo = isHost ? camHostVideo : camGuestVideo;
  if (!localCamStream) {
    try { localCamStream = await navigator.mediaDevices.getUserMedia({ video: true }); }
    catch (e) { setStatus('Caméra refusée ou indisponible.'); return; }
    selfVideo.srcObject = localCamStream;
  }
  camOn = !camOn;
  localCamStream.getVideoTracks()[0].enabled = camOn;
  camBtn.classList.toggle('on', camOn);
  camBtn.classList.toggle('off', !camOn);
  showTileVideo(selfVideo, camOn);
  if (camOn) safePlay(selfVideo);
  if (pc) pc.getTransceivers()[T_CAM].sender.replaceTrack(camOn ? localCamStream.getVideoTracks()[0] : null);
};

function stopScreenShare() {
  if (localScreenTrack) { localScreenTrack.stop(); localScreenTrack = null; }
  sharing = false;
  shareBtn.textContent = "Partager l'écran";
  shareBtn.classList.remove('active');
  shareBadge.classList.remove('visible');
  // clear the local self-preview only if it's showing OUR OWN share
  // (not an incoming remote one)
  screenVideo.srcObject = null;
  screenVideo.style.display = 'none';
  screenPlaceholder.style.display = 'flex';
  if (pc) pc.getTransceivers()[T_SCREEN].sender.replaceTrack(null);
}

shareBtn.onclick = async () => {
  if (sharing) { stopScreenShare(); return; }

  // always fully stop any previous screen track before requesting a new one,
  // so the browser never shows more than one "sharing this tab" indicator.
  if (localScreenTrack) { localScreenTrack.stop(); localScreenTrack = null; }

  if (!navigator.mediaDevices?.getDisplayMedia) {
    setStatus("Le partage d'écran n'est pas pris en charge sur ce navigateur (courant sur mobile).");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    localScreenTrack = stream.getVideoTracks()[0];
    sharing = true;
    shareBtn.textContent = 'Arrêter le partage';
    shareBtn.classList.add('active');
    shareBadge.classList.add('visible');

    // show it on your own site too, directly from the local stream —
    // this is a straight self-preview, not round-tripped through the network
    screenVideo.srcObject = stream;
    screenVideo.style.display = 'block';
    screenPlaceholder.style.display = 'none';
    safePlay(screenVideo);

    // catches the browser's own native "Stop sharing" button too
    localScreenTrack.onended = () => stopScreenShare();

    if (pc) pc.getTransceivers()[T_SCREEN].sender.replaceTrack(localScreenTrack);
  } catch (e) {
    setStatus('Partage annulé.');
  }
};

fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) {
    room.requestFullscreen?.().catch(() => {});
    room.classList.add('fullscreen-mode');
  } else {
    document.exitFullscreen?.();
  }
};
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) room.classList.remove('fullscreen-mode');
});

leaveBtn.onclick = () => { closeExistingConnection(); location.reload(); };
</script>
