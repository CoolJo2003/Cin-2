<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine2 — Regardez ensemble</title>
<style>
  :root {
    --bg: #0d0d14;
    --panel: #16161f;
    --accent: #ff4d67;
    --accent2: #6c5ce7;
    --text: #f2f2f5;
    --muted: #8a8a98;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top, #1a1a26, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    padding: 28px 20px 10px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: 2.2rem;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin: 6px 0 0; }

  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px;
    width: 92%;
    max-width: 480px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .row { display: flex; gap: 10px; margin-bottom: 14px; }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: #2a2a38; color: var(--text); }
  input {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #333340;
    background: #10101a;
    color: var(--text);
    font-size: 1rem;
  }
  #status { color: var(--muted); font-size: 0.9rem; min-height: 20px; }
  #roomCodeDisplay {
    font-size: 1.6rem;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--accent2);
    text-align: center;
    margin: 10px 0;
  }
  #shareLink {
    display: none;
    background: #10101a;
    padding: 10px;
    border-radius: 8px;
    word-break: break-all;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
  }
  video {
    width: 100%;
    max-width: 900px;
    margin-top: 20px;
    border-radius: 12px;
    background: black;
    display: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>🎬 Cine2</h1>
  <p>Ton salon perso pour regarder à deux. Sans plafond de résolution, sans premium.</p>
</header>

<div class="card" id="landing">
  <div class="row">
    <button class="btn-primary" id="createBtn">Créer un salon</button>
    <button class="btn-secondary" id="joinToggleBtn">Rejoindre un salon</button>
  </div>

  <div class="row hidden" id="joinRow">
    <input id="codeInput" placeholder="Code du salon (ex: A1B2C)" maxlength="6" style="text-transform:uppercase">
    <button class="btn-primary" id="joinBtn">Rejoindre</button>
  </div>

  <div id="roomCodeDisplay"></div>
  <div id="shareLink"></div>
  <div id="status"></div>

  <div class="row hidden" id="shareRow">
    <button class="btn-primary" id="shareScreenBtn">Partager mon écran / onglet</button>
  </div>
</div>

<video id="remoteVideo" autoplay playsinline></video>

<script>
const statusEl = document.getElementById('status');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const shareLinkEl = document.getElementById('shareLink');
const shareRow = document.getElementById('shareRow');
const remoteVideo = document.getElementById('remoteVideo');

const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProtocol}://${location.host}`);

let pc = null;
let isHost = false;
let roomCode = null;

// Pas de TURN payant : STUN public gratuit suffit pour la majorité des connexions.
const rtcConfig = {
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
};

function setStatus(msg) { statusEl.textContent = msg; }

function createPeerConnection() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.onicecandidate = (e) => {
    if (e.candidate) ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
  };

  pc.ontrack = (e) => {
    remoteVideo.srcObject = e.streams[0];
    remoteVideo.style.display = 'block';
  };

  return pc;
}

ws.onmessage = async (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === 'created') {
    roomCode = msg.code;
    roomCodeDisplay.textContent = roomCode;
    const link = `${location.origin}?join=${roomCode}`;
    shareLinkEl.style.display = 'block';
    shareLinkEl.textContent = link;
    shareRow.classList.remove('hidden');
    setStatus('Salon créé. Envoie ce lien à ton ami, puis clique sur "Partager mon écran".');
  }

  if (msg.type === 'joined') {
    roomCode = msg.code;
    setStatus('Salon rejoint. En attente du partage d’écran...');
  }

  if (msg.type === 'error') {
    setStatus('Erreur : ' + msg.message);
  }

  if (msg.type === 'peer-joined' && isHost) {
    setStatus('Ton ami est connecté. Tu peux partager ton écran.');
  }

  if (msg.type === 'peer-left') {
    setStatus('L’autre personne a quitté le salon.');
    remoteVideo.style.display = 'none';
  }

  // --- Réception d'une offre (viewer) ---
  if (msg.type === 'offer') {
    createPeerConnection();
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({ type: 'answer', sdp: answer }));
    setStatus('Connexion en cours...');
  }

  // --- Réception de la réponse (host) ---
  if (msg.type === 'answer') {
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    setStatus('Connecté ! Lecture en cours côté partage.');
  }

  if (msg.type === 'ice' && pc) {
    try { await pc.addIceCandidate(msg.candidate); } catch (e) {}
  }
};

// --- UI ---
document.getElementById('createBtn').onclick = () => {
  isHost = true;
  ws.send(JSON.stringify({ type: 'create' }));
};

document.getElementById('joinToggleBtn').onclick = () => {
  document.getElementById('joinRow').classList.toggle('hidden');
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code) return;
  isHost = false;
  ws.send(JSON.stringify({ type: 'join', code }));
};

document.getElementById('shareScreenBtn').onclick = async () => {
  try {
    // Pas de contrainte de résolution/frame rate imposée : on prend le flux natif du navigateur,
    // donc pas de plafond artificiel type "720p gratuit / 1080p premium".
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true // capte le son de l'onglet si l'utilisateur coche l'option navigateur
    });

    createPeerConnection();
    stream.getTracks().forEach((track) => pc.addTrack(track, stream));

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type: 'offer', sdp: offer }));

    setStatus('Partage démarré. En attente que ton ami se connecte...');
  } catch (err) {
    setStatus('Partage annulé ou refusé : ' + err.message);
  }
};

// Auto-remplissage si on arrive via un lien ?join=CODE
const params = new URLSearchParams(location.search);
if (params.get('join')) {
  document.getElementById('joinRow').classList.remove('hidden');
  document.getElementById('codeInput').value = params.get('join');
}
</script>

</body>
</html>
